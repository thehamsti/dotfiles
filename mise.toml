[tools]
# Keep runtime release lines stable; `update` installs patches within these ranges.
node = "lts"
bun = "latest"
deno = "latest"
go = "latest"
python = ["3.15", "3.14"]
ruby = "4.0"
rust = "stable"
java = "27"
dotnet = ["10", "8"]

act = "latest"
awscli = "latest"
aws-sam-cli = "latest"
awsebcli = "latest"
bat = "latest"
cloudflared = "latest"
cmake = "latest"
cocoapods = "latest"
delta = "latest"
direnv = "latest"
doctl = "latest"
fastfetch = "latest"
fd = "latest"
fzf = "latest"
gcloud = "latest"
gh = "latest"
helix = "latest"
himalaya = "latest"
herdr = "latest"
jq = "latest"
lazygit = "latest"
localstack = "latest"
neovim = "latest"
pipx = "latest"
pnpm = "12"
powershell = "latest"
protobuf = "latest"
rclone = "latest"
ripgrep = "latest"
ruff = "latest"
sbt = "latest"
scala = "latest"
scala-cli = "latest"
sentry-cli = "latest"
shellcheck = "latest"
shfmt = "latest"
sst = "latest"
starship = "latest"
stripe = "latest"
supabase = "latest"
terraform = "1.5"
tree-sitter = "latest"
uv = "latest"
xcodegen = "latest"
yq = "latest"
yt-dlp = "latest"
zoxide = "latest"

# Explicit backends preserve the upstream project when names differ from Brew.
"1password-cli" = "latest"
"aqua:planetscale/cli" = "latest"
# Bundle libgit2 so Homebrew upgrades cannot break the ls aliases.
"cargo:eza" = { version = "latest", features = "vendored-libgit2" }
"gem:tmuxinator" = "latest"
"github:steipete/gifgrep" = "latest"
"github:openclaw/gogcli" = "latest"
"github:openclaw/goplaces" = "latest"
"github:openclaw/imsg" = "latest"
"github:steipete/ordercli" = "latest"
"github:openclaw/Peekaboo" = "latest"
"github:openclaw/remindctl" = "latest"
"github:xdevplatform/xurl" = "latest"
# Newer releases rename the executable to notesmd-cli.
"github:Yakitrak/notesmd-cli" = "0.2"
"npm:diff-so-fancy" = "latest"
"npm:@withgraphite/graphite-cli" = "latest"
"npm:@steipete/summarize" = "latest"
"npm:yarn" = "1.22"
"pypi:ranger-fm" = "latest"
"pypi:antoniorodr/memo" = "latest"
"pypi:openai/whisper" = { version = "latest", python = "3.14" }
"pypi:powerline/powerline" = { version = "latest", python = "3.14" }
